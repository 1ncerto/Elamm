<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10090d">
  <meta name="description" content="Elam için hazırlanmış küçük bir sürpriz.">
  <title>Elam ♥</title>
  <style>
    :root {
      color-scheme: dark;
      --white: #fff8fb;
      --muted: rgba(255, 248, 251, .78);
      --accent: #ff6f9e;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background: #10090d;
      color: var(--white);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    /* Aynı fotoğraf hem girişte hem ana ekranda arka plan olarak kullanılır. */
    body::before {
      content: "";
      position: fixed;
      inset: -18px;
      z-index: -2;
      background-image: url("cocukluk.jpg");
      background-position: center;
      background-size: cover;
      filter: blur(13px) brightness(.48) saturate(.8);
      transform: scale(1.04);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at center, rgba(34, 10, 23, .18), rgba(8, 5, 8, .72)),
        linear-gradient(140deg, rgba(111, 25, 58, .28), rgba(8, 5, 8, .42));
    }

    .screen {
      min-height: 100svh;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 28px 20px;
    }

    .intro {
      text-align: center;
      animation: appear 1.1s ease both;
    }

    .intro-label {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: .76rem;
      letter-spacing: .42em;
      text-transform: uppercase;
    }

    .enter-button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, .56);
      border-radius: 999px;
      padding: 17px 39px;
      min-width: 205px;
      background: rgba(255, 255, 255, .09);
      color: var(--white);
      font: 600 .88rem/1 "Segoe UI", Arial, sans-serif;
      letter-spacing: .25em;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 45px rgba(0, 0, 0, .2), inset 0 0 22px rgba(255,255,255,.04);
      transition: background .25s ease, transform .25s ease, border-color .25s ease;
    }

    .enter-button:hover {
      background: rgba(255, 111, 158, .2);
      border-color: rgba(255, 190, 211, .9);
      transform: translateY(-3px);
    }

    .enter-button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }

    .main {
      display: none;
      width: min(900px, 100%);
      min-height: calc(100svh - 56px);
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: clamp(24px, 7vh, 70px) 18px 38px;
      animation: appear 1.2s ease both;
    }

    .date {
      margin: 0;
      color: rgba(255, 244, 249, .94);
      font-size: clamp(1.02rem, 3vw, 1.42rem);
      font-weight: 500;
      letter-spacing: .19em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .4);
    }

    .message {
      width: min(720px, 100%);
      margin: clamp(42px, 9vh, 88px) auto 0;
      padding: clamp(25px, 5vw, 48px) clamp(16px, 5vw, 42px);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 24px;
      background: rgba(19, 8, 14, .28);
      box-shadow: 0 18px 70px rgba(0, 0, 0, .18);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .message p {
      margin: 0;
      color: var(--white);
      font-size: clamp(1.08rem, 3.1vw, 1.55rem);
      line-height: 1.8;
      font-weight: 400;
      text-wrap: balance;
      text-shadow: 0 2px 15px rgba(0, 0, 0, .42);
    }

    .message p + p { margin-top: 13px; }

    .message .greeting {
      color: #ffd4e2;
      font-size: clamp(1.3rem, 3.8vw, 1.9rem);
      font-weight: 600;
      margin-bottom: 19px;
    }

    .message .closing {
      margin-top: 24px;
      color: #ffb7cf;
      font-weight: 600;
    }

    .heart {
      margin-top: 24px;
      color: #ff8fb2;
      font-size: 1.35rem;
      animation: heartbeat 1.8s ease-in-out infinite;
    }

    .show-main .intro { display: none; }
    .show-main .main { display: flex; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.16); }
    }

    @media (max-width: 520px) {
      .date { letter-spacing: .1em; }
      .message { margin-top: 48px; border-radius: 19px; }
      .message p { line-height: 1.68; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <section class="screen intro" aria-label="Giriş">
    <div>
      <p class="intro-label">Sana küçük bir sürprizim var</p>
      <button class="enter-button" id="enterButton" type="button">HAZIR MISIN?</button>
    </div>
  </section>

  <main class="screen main" id="mainContent">
    <p class="date">11/11/2023 &amp; 11/11/2026</p>

    <section class="message" aria-label="Elam'a mesaj">
      <p class="greeting">Yeni yılımız kutlu olsun Elam.</p>
      <p>Seni her zaman sevdim ve her zaman da seveceğim.</p>
      <p>3 yıl değil, bir ömür beraberiz.</p>
      <p class="closing">Seni çok seviyorum Elam.</p>
      <div class="heart" aria-hidden="true">♥</div>
    </section>
  </main>

  <script>
    const enterButton = document.getElementById("enterButton");
    enterButton.addEventListener("click", () => {
      document.body.classList.add("show-main");
      document.getElementById("mainContent").setAttribute("aria-live", "polite");
    });
  </script>
</body>
</html>
